---
title: large_outbound_low_prevalence
description: Detects large volumes of data being sent outbound to low prevalence domains. This combination of high data transfer to rarely-seen domains is a strong indicator of data exfiltration.
author: security_team
severity: high
mode: staging
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
mitre_tactics: TA0010
mitre_techniques: T1048
risk_score: auto
risk_entity: src_ip
tags:
  - exfiltration
  - network
  - data_loss
ai_triage_hints:
  ignore_when:
    - "Domain is a known cloud backup service (e.g., Backblaze, Carbonite)"
    - "Source IP is a known backup server or data sync service"
    - "Domain belongs to approved file sharing service"
    - "Transfer is to a known CDN for legitimate uploads"
  suspicious_when:
    - "Domain was registered in last 30 days"
    - "Transfer occurs outside business hours"
    - "Multiple hosts sending large data to same rare domain"
    - "Domain uses suspicious TLD (.top, .xyz, .tk, .cc)"
    - "Source host has no history of large outbound transfers"
  context: "Large outbound transfers to low prevalence domains often indicate exfiltration. Verify the domain reputation, check if the user has legitimate business need, and review what data may have been transferred."
---
source_type=squid_proxy
  | prevalence enrich=true window=24h
  | where host_count < 3
  | stats sum(bytes_out) as total_bytes_out, min(timestamp) as first_seen, max(timestamp) as last_seen by src_ip, domain
  | where total_bytes_out > 100000000
