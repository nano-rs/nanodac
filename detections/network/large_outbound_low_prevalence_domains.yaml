---
title: large_outbound_low_prevalence_domains
description: Detects large outbound data transfers to domains with low prevalence, potentially indicating data exfiltration or C2 communication with high data volume
author: security_team
severity: high
mode: staging
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
mitre_tactics: TA0010
mitre_techniques: T1041
tags:
  - network
  - exfiltration
  - c2
  - data_transfer
ai_triage_hints:
  ignore_when:
    - "Domain is a known CDN or cloud storage provider (AWS, GCP, Azure)"
    - "Domain is on corporate allow list for legitimate file transfers"
    - "User is from IT/DevOps team with expected large uploads"
    - "Transfer is to known software update or backup service"
  suspicious_when:
    - "Transfer occurs outside business hours (before 7am or after 7pm)"
    - "Domain was registered in last 30 days (check WHOIS)"
    - "Multiple users uploading large amounts to same rare domain"
    - "Domain uses suspicious TLD (.top, .xyz, .tk, .cc)"
    - "Transfer size is unusually large (>100MB) for the user's role"
    - "User has no business justification for large external transfers"
  context: "Large data transfers to low prevalence domains often indicate data exfiltration. Attackers use unique domains to avoid detection and transfer stolen data. However, legitimate use cases include cloud backups, software deployments, or niche business applications."
---
source_type=squid_proxy
| prevalence enrich=true window=24h
| where host_count < 3
| stats sum(bytes_out) as total_bytes_out, count() as connection_count by src_ip, dest_domain, user
| where total_bytes_out > 50000000
| eval total_mb = round(total_bytes_out / 1000000, 2)
| risk score=60 entity=src_ip factor="Large transfer to rare domain"
| where total_bytes_out > 100000000
| risk score=80 factor="Very large transfer (>100MB)"
| sort total_bytes_out desc
| table timestamp, src_ip, user, dest_domain, total_mb, connection_count, host_count, risk_score, risk_factors
