---
title: crowdstrike_detection_pass_through
description: Passes through CrowdStrike detections as individual NanoSIEM alerts. Each vendor detection becomes its own alert for 1:1 tracking.
author: dan
severity: high
mode: alerting
detection_mode: scheduled
schedule: "*/1 * * * *"
lookback: 5m
alert_mode: per_event
mitre_tactics: TA0001
mitre_techniques: T1059
tags:
  - endpoint
  - crowdstrike
  - vendor_pass_through
ai_triage_hints:
  ignore_when:
    - "Detection is informational severity in CrowdStrike"
    - "Process is a known IT management tool (SCCM, Intune)"
  suspicious_when:
    - "CrowdStrike severity is critical"
    - "Multiple detections on same host in short timeframe"
  context: "These are CrowdStrike Falcon detections passed through as individual alerts. Each alert maps 1:1 to a CrowdStrike detection. Check the CrowdStrike console for full context and response actions."
---
source_type=crowdstrike
| where event_type="detection"
| risk score=auto entity=src_host factor="CrowdStrike detection"
