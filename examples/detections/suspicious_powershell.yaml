---
title: suspicious_powershell_encoded_commands
description: Detects PowerShell execution with base64 encoded commands, commonly used by attackers to obfuscate malicious scripts.
author: dan
severity: high
mode: staging
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
mitre_tactics:
  - TA0002
  - TA0005
mitre_techniques:
  - T1059.001
  - T1027
tags:
  - endpoint
  - powershell
  - execution
  - defense_evasion
ai_triage_hints:
  ignore_when:
    - "Process is spawned by known IT management tool (SCCM, Intune)"
    - "User is member of IT Admins group performing authorized task"
    - "Command decodes to known legitimate script (check decoded content)"
    - "Host is in development/lab environment subnet"
  suspicious_when:
    - "Command contains download cradle patterns (IEX, Invoke-Expression)"
    - "Process parent is unexpected (explorer.exe, outlook.exe, winword.exe)"
    - "Execution occurs on server that shouldn't run PowerShell interactively"
    - "User has no history of PowerShell usage"
  context: "Base64 encoded PowerShell is very common in attacks but also used by some legitimate admin tools. Always decode the command to understand what it does. Check for download cradles, reverse shells, or credential access."
---
metadata.log_source=windows_security
| where class_uid=1007 AND activity_id=1
| where process.name="powershell.exe" OR process.name="pwsh.exe"
| where process.cmd_line~"-e[ncodedcommand]*" OR process.cmd_line~"-enc "
| risk score=75 entity=device.hostname factor="Encoded PowerShell command"
| stats count() by user.name, device.hostname, process.cmd_line, risk_score, risk_factors
